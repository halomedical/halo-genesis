name: pr-governance

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  semantic-title:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce conventional PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            ci
            build
            perf
            revert
          requireScope: true
          scopes: |
            shell
            server
            shared
            drive-adapter
            agent-executor
            supabase
            registry
            auth
            billing
            calendar
            ci
            docs
          subjectPattern: ^.{6,}$

  path-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v5
        continue-on-error: true
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

  type-label:
    runs-on: ubuntu-latest
    steps:
      - name: Add semantic type label from title
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const title = context.payload.pull_request.title || "";
            const match = title.match(/^(feat|fix|refactor|docs|test|chore|ci|build|perf|revert)\([^)]+\):/);
            if (!match) {
              core.info("No conventional type detected; skipping type label.");
              return;
            }
            const map = {
              feat: "type: feature",
              fix: "type: fix",
              refactor: "type: refactor",
              docs: "type: docs",
              test: "type: test",
              chore: "type: chore",
              ci: "type: ci",
              build: "type: build",
              perf: "type: perf",
              revert: "type: revert",
            };
            const label = map[match[1]];
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
