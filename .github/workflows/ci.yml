name: halo-genesis-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout halo-components dependency
        uses: actions/checkout@v4
        with:
          repository: halomedical/halo-components
          path: halo-components

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/shell/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build
        env:
          HALO_COMPONENTS_PATH: ../../halo-components

      - name: Calendar smoke test
        run: npm run test:calendar
