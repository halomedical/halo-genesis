name: halo-genesis-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone halo-components dependency
        env:
          HALO_COMPONENTS_TOKEN: ${{ secrets.HALO_COMPONENTS_READ_TOKEN || github.token }}
        run: |
          rm -rf ../halo-components
          git clone --depth 1 --branch main "https://x-access-token:${HALO_COMPONENTS_TOKEN}@github.com/halomedical/halo-components.git" ../halo-components

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/shell/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build
        env:
          HALO_COMPONENTS_PATH: ../../../halo-components

      - name: Calendar smoke test
        run: npm run test:calendar
        env:
          SESSION_SECRET: ci-session-secret
          GOOGLE_CLIENT_ID: ci-google-client-id
          GOOGLE_CLIENT_SECRET: ci-google-client-secret
          GEMINI_API_KEY: ci-gemini-api-key
